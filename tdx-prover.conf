[Include]
Include=base/mkosi.conf

[Distribution]
Mirror=https://snapshot.debian.org/archive/debian/20251113T083151Z/

[Build]
# Build an explicit tools-tree from the pinned Debian snapshot, so commands
# mkosi runs (cpio, zstd, etc.) come from a deterministic distribution rather
# than the host. Without this, mkosi falls back to host tools — Ubuntu 24.04
# (CI) ships zstd 1.5.5, Debian trixie (Lima/Azure) ships 1.5.7, and the two
# versions produce slightly different compressed bytes for the same input,
# which changes the initrd hash and PCR[4]/PCR[9]/PCR[11].
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
ToolsTreeMirror=https://snapshot.debian.org/archive/debian/20251113T083151Z/

# --- Common content shared by both variants ---------------------------------
# Variant-specific content lives in mkosi.profiles/{surge,taiko}/mkosi.conf
# and is selected via --profile=surge|taiko (set by the Makefile from IMAGE=).

[Content]
Packages=prometheus
         prometheus-node-exporter
         prometheus-process-exporter
         rclone
         libsnappy1v5
         openntpd
         bubblewrap
         dropbear
         iptables
         iproute2
         socat
         conntrack
         netfilter-persistent
         curl
         jq
         ncat
         logrotate
         sudo
         uidmap
         passt
         fuse-overlayfs
         cryptsetup
         openssh-sftp-server
         udev
         pkg-config
         libtss2-dev

BuildPackages=build-essential
              pkg-config
              git
              gcc
              dotnet-runtime-10.0
              dotnet-sdk-10.0
              libleveldb-dev
              libsnappy-dev
              zlib1g-dev
              libzstd-dev
              libpq-dev
              libssl-dev
              libtss2-dev
              golang
