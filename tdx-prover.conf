[Include]
Include=base/mkosi.conf

[Distribution]
Mirror=https://snapshot.debian.org/archive/debian/20251113T083151Z/

[Build]

# --- Common content shared by both variants ---------------------------------
# Variant-specific content lives in mkosi.profiles/{surge,taiko}/mkosi.conf
# and is selected via --profile=surge|taiko (set by the Makefile from IMAGE=).

[Content]
Packages=prometheus
         prometheus-node-exporter
         prometheus-process-exporter
         rclone
         libsnappy1v5
         openntpd
         bubblewrap
         dropbear
         iptables
         iproute2
         socat
         conntrack
         netfilter-persistent
         curl
         jq
         ncat
         logrotate
         sudo
         uidmap
         passt
         fuse-overlayfs
         cryptsetup
         openssh-sftp-server
         udev
         pkg-config
         libtss2-dev

BuildPackages=build-essential
              pkg-config
              git
              gcc
              dotnet-runtime-10.0
              dotnet-sdk-10.0
              libleveldb-dev
              libsnappy-dev
              zlib1g-dev
              libzstd-dev
              libpq-dev
              libssl-dev
              libtss2-dev
              golang
