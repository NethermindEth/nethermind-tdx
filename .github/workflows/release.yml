name: Release taiko-tdx-prover

# Builds Azure VHD (AZURE=true) and GCP tar.gz (GCP=true)
# images in parallel, extracts measured-boot PCR values and TDX RTMR values,
# and publishes all artifacts to a GitHub release. Operators consume the
# release to:
#
#   1. Deploy the image to an Azure or GCP TDX VM
#      (see tools/deploy-azure / tools/deploy-gcp / README).
#   2. Compare the live quote against measurements.json before trusting the VM.
#   3. Register the prover on-chain with
#      `cargo run -p xtask -- register-tdx --trust --register ...`
#      (see raiko2 docs/tdx_register.md).
#
# Manual trigger only — pick a tag and a runner from the Actions UI.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Created if it does not already exist.'
        required: true
        type: string
      runner:
        description: 'Runner label (default ubuntu-24.04; pick a self-hosted label for fat-disk builds).'
        required: false
        type: string
        default: 'ubuntu-24.04'
      prerelease:
        description: 'Mark the release as a pre-release.'
        required: false
        type: boolean
        default: false
      image:
        description: 'mkosi image variant.'
        required: false
        type: choice
        default: 'taiko-tdx-prover'
        options:
          - taiko-tdx-prover
          - surge-tdx-prover
      env_file:
        description: 'env.json source file committed in the repo (e.g. env.taiko-devnet.json). Copied to env.json before the build.'
        required: false
        type: string
        default: 'env.taiko-devnet.json'

permissions:
  contents: write

jobs:
  # Lightweight job: creates the release shell so both build jobs can upload
  # to it in parallel without racing to create the same release.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }} — ${{ inputs.image }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            **Source commit**: `${{ github.sha }}`
            **Chain config**: `${{ inputs.env_file }}`

            Azure (`${{ inputs.image }}`) and GCP (`${{ inputs.image }}-gcp`)
            artifacts are uploaded by parallel build jobs — they may appear a few
            minutes after the release is created.

  build-azure:
    needs: create-release
    runs-on: ${{ inputs.runner }}
    env:
      IMAGE: ${{ inputs.image }}
      FORCE_LIMA: ''
    steps:
      - name: Free disk space (GitHub-hosted runners only)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache mkosi build dirs
        uses: actions/cache@v4
        with:
          path: |
            mkosi.cache
            mkosi.builddir
          key: mkosi-azure-${{ inputs.image }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'tdx-prover.conf', 'base/mkosi.conf', 'mkosi.profiles/**/mkosi.conf') }}
          restore-keys: |
            mkosi-azure-${{ inputs.image }}-${{ runner.os }}-

      - name: Prepare env.json
        env:
          # Private L1 endpoints live in repo/org Actions secrets, not in the
          # committed env file (env.taiko-devnet.json ships them empty).
          L1_RPC: ${{ secrets.L1_RPC }}
          L1_RPC_WS: ${{ secrets.L1_RPC_WS }}
          L1_BEACON_RPC: ${{ secrets.L1_BEACON_RPC }}
        run: |
          set -euxo pipefail
          ENV_SOURCE="${{ inputs.env_file }}"
          if [ ! -f "$ENV_SOURCE" ]; then
            echo "Error: env_file '$ENV_SOURCE' not found in the repository."
            ls env*.json 2>/dev/null || echo "  (none)"
            exit 1
          fi
          cp "$ENV_SOURCE" env.json
          # Inject the private L1 endpoints from CI secrets. Each is applied only
          # when set, so a locally-provided env.json is left untouched. -x is off
          # here so the values never hit the build log (GitHub also masks them).
          set +x
          if [ -n "${L1_RPC}${L1_RPC_WS}${L1_BEACON_RPC}" ]; then
            jq --arg rpc "$L1_RPC" --arg ws "$L1_RPC_WS" --arg beacon "$L1_BEACON_RPC" \
              '.tdx_prover.l1_rpc       = (if $rpc    != "" then $rpc    else .tdx_prover.l1_rpc       end)
             | .tdx_prover.l1_rpc_ws    = (if $ws     != "" then $ws     else .tdx_prover.l1_rpc_ws    end)
             | .tdx_prover.l1_beacon_rpc= (if $beacon != "" then $beacon else .tdx_prover.l1_beacon_rpc end)' \
              env.json > env.json.tmp && mv env.json.tmp env.json
            echo "Injected L1 endpoints from CI secrets."
          else
            echo "WARN: L1_RPC / L1_RPC_WS / L1_BEACON_RPC secrets not set — L1 endpoints stay empty."
          fi
          set -x
          python3 -c "import json; d=json.load(open('env.json'))['tdx_prover']; print('  chain:   L1={} L2={}'.format(d['l1_chainid'],d['l2_chainid'])); print('  inbox:   '+d['shasta_inbox']); print('  verifier:'+d['shasta_verifier'])"

      - name: Enable unprivileged user namespaces
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euxo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          getent passwd "$USER" | cut -d: -f1
          grep -E "^$USER:" /etc/subuid || echo "WARN: no subuid range for $USER"
          grep -E "^$USER:" /etc/subgid || echo "WARN: no subgid range for $USER"

      - name: Build Azure VHD (AZURE=true)
        run: |
          set -euxo pipefail
          make build IMAGE="$IMAGE" AZURE=true

      - name: Fix build directory ownership
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo chown -R "$USER:$USER" build/

      - name: Collect Azure release artifacts
        id: artifacts
        run: |
          set -euxo pipefail
          scripts/collect_release_artifacts.sh "${IMAGE}" | tee -a "$GITHUB_OUTPUT"

      - name: Resolve image version
        id: version
        run: |
          base='${{ steps.artifacts.outputs.base }}'
          echo "version=${base#${IMAGE}_}" >> "$GITHUB_OUTPUT"

      - name: Show artifact sizes
        run: |
          ls -lh \
            '${{ steps.artifacts.outputs.vhd }}' \
            '${{ steps.artifacts.outputs.measurements }}' \
            '${{ steps.artifacts.outputs.sums }}'
          cat '${{ steps.artifacts.outputs.sums }}'

      - name: Upload Azure artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ## Azure (`${{ steps.artifacts.outputs.base }}`)

            Build flags: `make build IMAGE=${{ inputs.image }} AZURE=true`

            - `${{ steps.artifacts.outputs.base }}.vhd` — Azure-compatible fixed VHD.
              Deploy with `go run tools/deploy-azure/main.go deploy --disk-path …`
            - `${{ steps.artifacts.outputs.base }}.measurements.json` — vTPM PCR
              reference values. Pass as `--release-url` to `register-tdx` to verify
              the live quote. Works for both Azure and GCP.
            - `${{ steps.artifacts.outputs.base }}.SHA256SUMS`
          files: |
            ${{ steps.artifacts.outputs.vhd }}
            ${{ steps.artifacts.outputs.measurements }}
            ${{ steps.artifacts.outputs.sums }}

  build-gcp:
    needs: create-release
    runs-on: ${{ inputs.runner }}
    env:
      IMAGE: ${{ inputs.image }}
      FORCE_LIMA: ''
    steps:
      - name: Free disk space (GitHub-hosted runners only)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache mkosi build dirs
        uses: actions/cache@v4
        with:
          path: |
            mkosi.cache
            mkosi.builddir
          key: mkosi-gcp-${{ inputs.image }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'tdx-prover.conf', 'base/mkosi.conf', 'mkosi.profiles/**/mkosi.conf') }}
          restore-keys: |
            mkosi-gcp-${{ inputs.image }}-${{ runner.os }}-

      - name: Prepare env.json
        env:
          # Private L1 endpoints live in repo/org Actions secrets, not in the
          # committed env file (env.taiko-devnet.json ships them empty).
          L1_RPC: ${{ secrets.L1_RPC }}
          L1_RPC_WS: ${{ secrets.L1_RPC_WS }}
          L1_BEACON_RPC: ${{ secrets.L1_BEACON_RPC }}
        run: |
          set -euxo pipefail
          ENV_SOURCE="${{ inputs.env_file }}"
          if [ ! -f "$ENV_SOURCE" ]; then
            echo "Error: env_file '$ENV_SOURCE' not found in the repository."
            ls env*.json 2>/dev/null || echo "  (none)"
            exit 1
          fi
          cp "$ENV_SOURCE" env.json
          # Inject the private L1 endpoints from CI secrets. Each is applied only
          # when set, so a locally-provided env.json is left untouched. -x is off
          # here so the values never hit the build log (GitHub also masks them).
          set +x
          if [ -n "${L1_RPC}${L1_RPC_WS}${L1_BEACON_RPC}" ]; then
            jq --arg rpc "$L1_RPC" --arg ws "$L1_RPC_WS" --arg beacon "$L1_BEACON_RPC" \
              '.tdx_prover.l1_rpc       = (if $rpc    != "" then $rpc    else .tdx_prover.l1_rpc       end)
             | .tdx_prover.l1_rpc_ws    = (if $ws     != "" then $ws     else .tdx_prover.l1_rpc_ws    end)
             | .tdx_prover.l1_beacon_rpc= (if $beacon != "" then $beacon else .tdx_prover.l1_beacon_rpc end)' \
              env.json > env.json.tmp && mv env.json.tmp env.json
            echo "Injected L1 endpoints from CI secrets."
          else
            echo "WARN: L1_RPC / L1_RPC_WS / L1_BEACON_RPC secrets not set — L1 endpoints stay empty."
          fi
          set -x
          python3 -c "import json; d=json.load(open('env.json'))['tdx_prover']; print('  chain:   L1={} L2={}'.format(d['l1_chainid'],d['l2_chainid'])); print('  inbox:   '+d['shasta_inbox']); print('  verifier:'+d['shasta_verifier'])"

      - name: Enable unprivileged user namespaces
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euxo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          getent passwd "$USER" | cut -d: -f1
          grep -E "^$USER:" /etc/subuid || echo "WARN: no subuid range for $USER"
          grep -E "^$USER:" /etc/subgid || echo "WARN: no subgid range for $USER"

      - name: Build GCP image (GCP=true)
        run: |
          set -euxo pipefail
          # GCP produces image_id "<image>-gcp" (see Makefile), keeping
          # artifacts distinct from Azure's "<image>" in the same release.
          make build IMAGE="$IMAGE" GCP=true

      - name: Fix build directory ownership
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo chown -R "$USER:$USER" build/

      - name: Collect GCP release artifacts
        id: artifacts
        run: |
          set -euxo pipefail
          scripts/collect_gcp_release_artifacts.sh "${IMAGE}-gcp" | tee -a "$GITHUB_OUTPUT"

      - name: Resolve image version
        id: version
        run: |
          base='${{ steps.artifacts.outputs.base }}'
          echo "version=${base#${IMAGE}-gcp_}" >> "$GITHUB_OUTPUT"

      - name: Show artifact sizes
        run: |
          ls -lh \
            '${{ steps.artifacts.outputs.targz }}' \
            '${{ steps.artifacts.outputs.measurements }}' \
            '${{ steps.artifacts.outputs.gcp_measurements }}' \
            '${{ steps.artifacts.outputs.sums }}'
          cat '${{ steps.artifacts.outputs.sums }}'

      - name: Upload GCP artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ## GCP (`${{ steps.artifacts.outputs.base }}`)

            Build flags: `make build IMAGE=${{ inputs.image }} GCP=true`

            - `${{ steps.artifacts.outputs.base }}.tar.gz` — GCP raw disk image
              (`disk.raw` inside tar). Deploy with
              `go run tools/deploy-gcp deploy --disk-path …`
            - `${{ steps.artifacts.outputs.base }}.measurements.json` — vTPM PCR
              reference values. Pass as `--release-url` to `register-tdx`.
            - `${{ steps.artifacts.outputs.base }}.gcp_measurements.json` — TDX RTMR
              values (dstack-mr). Future TDX-native verifier use.
            - `${{ steps.artifacts.outputs.base }}.SHA256SUMS`
          files: |
            ${{ steps.artifacts.outputs.targz }}
            ${{ steps.artifacts.outputs.measurements }}
            ${{ steps.artifacts.outputs.gcp_measurements }}
            ${{ steps.artifacts.outputs.sums }}
