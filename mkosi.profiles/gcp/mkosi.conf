[Content]
ExtraTrees=mkosi.extra

Packages=udev

# Append the GCP kernel snippet (enables the gve / gVNIC driver) to the base
# kernel config before the kernel is built. KERNEL_CONFIG_SNIPPETS is consumed
# by kernel/mkosi.build; this Environment= line accumulates on top of the base
# config's Environment= so KERNEL_IMAGE / KERNEL_VERSION are still passed.
Environment=KERNEL_CONFIG_SNIPPETS=kernel/gcp.config
